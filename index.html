(function(root){

  function loadAds(){

  function finishAd(request,success,code){

    for(const [name,handler] of request.handlers){try{controller.removeEventListener(name,handler);}catch(_){}}

    syncPause();
    push('finished',{id:request.id,success,code});

  }
  function requestRewarded(id){
    if(!inTelegram||!loaded||isPaused()||activeAd||adState!=='ready'||!controller||!Number.isSafeInteger(id)||id<1)return false;

    saveBeforePause();syncPause();
    const on=(name,callback)=>{
      const handler=()=>{if(activeAd===request)callback();};
      request.handlers.push([name,handler]);controller.addEventListener(name,handler);
    };

      on('onStart',()=>{if(!request.started){request.started=true;push('started',{id});}});
      on('onSkip',()=>{request.cancelled=true;request.code='cancelled';});
      on('onError',()=>{request.cancelled=true;request.code='adError';});
      on('onBannerNotFound',()=>{request.cancelled=true;request.code='noFill';});
      on('onNonStopShow',()=>{request.cancelled=true;request.code='rateLimited';});
      on('onTooLongSession',()=>{request.cancelled=true;request.code='sessionExpired';});

      on('onComplete',()=>{request.cancelled=true;request.code='wrongBlockType';});

      if(!promise||typeof promise.then!=='function')throw new Error('Invalid SDK response');

        const success=!request.cancelled&&!!result&&result.done===true&&result.error===false;
        finishAd(request,success,success?'finished':request.code);
      },()=>finishAd(request,false,request.code));
    }catch(_){finishAd(request,false,'adError');return false;}
    return true;
  }
  function metric(value){return Math.max(0,Number.isFinite(Number(value))?Number(value):0);}
  function viewport(){
    const width=Math.max(1,Math.min(16384,Math.round(metric(root.innerWidth)||1280)));
    let height=Math.max(1,Math.min(16384,Math.round(metric(root.innerHeight)||800)));
    if(inTelegram&&!desktop&&metric(app.viewportStableHeight)>0)height=Math.max(1,Math.min(height,Math.round(app.viewportStableHeight)));
    return {width,height};
  }
  function insets(){
    const safe=inTelegram?app.safeAreaInset||{}:{};
    const content=inTelegram?app.contentSafeAreaInset||{}:{};

    for(const side of ['left','top','right','bottom'])result[side]=metric(safe[side])+metric(content[side]);
    return result;
  }
  function frame(){

    const availableWidth=Math.max(1,v.width-safe.left-safe.right);
    const available=Math.max(1,v.height-safe.top-safe.bottom);
    const width=Math.min(availableWidth,available*2.4);
    const boxed=width/available<1.5;
    const height=boxed?Math.min(available,width/1.6):available;

    return {left:Math.round(safe.left+(availableWidth-width)/2),top:Math.round(safe.top+(available-height)/2),width,height,logicalWidth:Math.round(width*scale),logicalHeight:Math.round(height*scale),boxed};
  }
  function fullscreenText(){
    const code=String(app&&app.initDataUnsafe&&app.initDataUnsafe.user&&app.initDataUnsafe.user.language_code||'en').toLowerCase().split(/[-_]/)[0];
    // Locale is used only for this local UI, never as identity or payment proof.
    const texts={en:['Full screen','Enlarge the window for comfortable PC controls.'],ru:['На весь экран','Разверни окно для удобной игры на ПК.'],uk:['На весь екран','Розгорни вікно для зручної гри на ПК.'],de:['Vollbild','Vergrößere das Fenster für die PC-Steuerung.'],fr:['Plein écran','Agrandis la fenêtre pour jouer sur PC.'],pl:['Pełny ekran','Powiększ okno, aby wygodnie grać na komputerze.'],es:['Pantalla completa','Amplía la ventana para jugar en PC.'],zh:['全屏','放大窗口以便在电脑上操作。'],ja:['全画面','PCで操作しやすいようにウィンドウを広げてください。'],it:['Schermo intero','Ingrandisci la finestra per giocare su PC.']};
    return texts[code]||texts.en;
  }
  function updateDesktopControls(){
    if(!desktopControls)return;
    const f=frame(),safe=insets(),room=f.top-safe.top;
    const visible=entered&&f.boxed&&room>=56&&!app.isFullscreen&&!(root.document&&root.document.fullscreenElement)&&!activeAd&&active&&!hidden;
    desktopControls.style.display=visible?'flex':'none';
    desktopControls.style.top=(safe.top+6)+'px';
    if(desktopHint)desktopHint.style.display=room>=100?'block':'none';
  }
  function browserFullscreen(){
    try{
      const doc=root.document,target=doc&&doc.documentElement;
      if(!target||typeof target.requestFullscreen!=='function'||doc.fullscreenElement)return false;
      const result=target.requestFullscreen();

    }catch(_){updateDesktopControls();return false;}
  }
  function requestDesktopFullscreen(manual=false){
    if(!desktop||activeAd)return false;
    try{
      if(app.isFullscreen)return true;
      if(manual&&fullscreenAttempted&&browserFullscreen())return true;
      if(!fullscreenUnsupported&&supported('8.0')&&typeof app.requestFullscreen==='function'){

      }
    }catch(_){fullscreenUnsupported=true;}
    return browserFullscreen();
  }
  function attachDesktopControls(){
    if(!desktop||desktopControls||!root.document||!root.document.body)return;
    const text=fullscreenText();
    desktopControls=root.document.createElement('div');desktopControls.id='tg-desktop-controls';
    desktopControls.setAttribute('style','position:fixed;left:50%;transform:translateX(-50%);z-index:900;display:none;flex-direction:column;align-items:center;gap:6px;width:min(360px,calc(100% - 24px));font:14px sans-serif;text-align:center;color:white;');
    const button=root.document.createElement('button');button.id='tg-desktop-fullscreen';button.textContent=text[0];
    button.setAttribute('style','min-height:48px;padding:10px 22px;border:2px solid #a9dfff;border-radius:12px;color:white;background:#1769af;font:bold 16px sans-serif;cursor:pointer;touch-action:manipulation;');
    button.addEventListener('click',()=>requestDesktopFullscreen(true));desktopControls.appendChild(button);
    desktopHint=root.document.createElement('span');desktopHint.textContent=text[1];desktopControls.appendChild(desktopHint);
    root.document.body.appendChild(desktopControls);updateDesktopControls();
  }
  function resize(){
    const v=viewport(),f=frame(),canvas=root.document&&root.document.getElementById('canvas');
    const requested=Math.max(1,metric(root.devicePixelRatio)||1);
    // Bound the desktop drawing buffer independently of art/quality settings.
    const ratio=Math.min(desktop?Math.min(requested,2):requested,Math.sqrt(8388608/(f.width*f.height)),4096/f.width,4096/f.height);

      const width=Math.max(1,Math.floor(f.width*ratio)),height=Math.max(1,Math.floor(f.height*ratio));

      if(canvas.height!==height)canvas.height=height;
      canvas.style.width=f.width+'px';canvas.style.height=f.height+'px';
      if(desktop){canvas.style.position='absolute';canvas.style.left=f.left+'px';canvas.style.top=f.top+'px';}
    }
    if(root.document&&root.document.documentElement)root.document.documentElement.style.setProperty('--osr-view-height',v.height+'px');
    updateDesktopControls();
  }
  function back(value){
    if(backVisible===!!value)return;
    backVisible=!!value;
    try{if(inTelegram&&app.BackButton){const fn=backVisible?'show':'hide';if(typeof app.BackButton[fn]==='function')app.BackButton[fn]();}}catch(_){}
  }
  function attachGate(){
    if(!root.document||gate||entered)return;
    resize();
    gate=root.document.createElement('div');gate.id='tg-start-gate';
    gate.setAttribute('style','position:fixed;left:0;top:0;width:100%;height:var(--osr-view-height,100vh);z-index:1000;display:flex;align-items:center;justify-content:center;background:#102337cc;');
    playButton=root.document.createElement('button');playButton.id='tg-play-button';
    playButton.textContent=loaded?'PLAY':'Loading…';playButton.disabled=!loaded;
    playButton.setAttribute('style','font:bold 28px sans-serif;color:white;background:#239b46;border:3px solid white;border-radius:16px;padding:22px 70px;cursor:pointer;touch-action:manipulation;');
    playButton.addEventListener('click',()=>{if(!loaded||entered)return;entered=true;gate.remove();gate=null;requestDesktopFullscreen();resize();syncPause();focusGame();});
    gate.appendChild(playButton);root.document.body.appendChild(gate);syncPause();
    attachDesktopControls();
  }
  root.SigmaTelegram={inTelegram,desktop,viewport,insets,frame,resize,requestDesktopFullscreen};
  root.SigmaAds={
    platform:'telegram',supportsRewarded:inTelegram,blockId:BLOCK_ID,status:()=>adState,isPaused,isMuted,
    setEventCallback(callback){listener=callback;for(const event of events.splice(0))push(event.type,event);},
    takeEvents:()=>JSON.stringify(events.splice(0)),
    markLoaded(){loaded=true;resize();if(playButton){playButton.textContent='PLAY';playButton.disabled=false;}call('ready');},
    setPlaying(){},happyTime(){},requestRewarded,requestInterstitial:()=>false,
    setBackVisible:back,
    readSave(){saveRead=false;try{const value=root.localStorage.getItem(SAVE_KEY);saveRead=true;return JSON.stringify({ok:true,value,epoch:0});}catch(_){return JSON.stringify({ok:false,code:'readFailed'});}},
    writeSave(payload,epoch){if(!saveRead||epoch!==0)return JSON.stringify({ok:false,code:'saveNotLoaded'});try{root.localStorage.setItem(SAVE_KEY,payload);return JSON.stringify({ok:true});}catch(_){return JSON.stringify({ok:false,code:'writeFailed'});}},
    retryConnect(){loadAds();push('state',{value:adState});}
  };
  if(inTelegram){
    call('expand');
    if(supported('7.7'))call('disableVerticalSwipes');
    if(supported('6.1')){try{app.BackButton.onClick(()=>push('back'));app.BackButton.hide();}catch(_){} }

      for(const name of ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged'])app.onEvent(name,resize);
      app.onEvent('fullscreenFailed',event=>{if(event&&event.error==='UNSUPPORTED')fullscreenUnsupported=true;resize();});
      app.onEvent('viewportChanged',event=>{if(!event||event.isStateStable!==false)resize();});
      app.onEvent('deactivated',()=>{saveBeforePause();active=false;syncPause();});

    }
  }
  if(root.addEventListener){root.addEventListener('resize',resize);root.addEventListener('pagehide',saveBeforePause);}
  if(root.document){
    root.document.addEventListener('fullscreenchange',resize);
    root.document.addEventListener('visibilitychange',()=>{if(root.document.hidden)saveBeforePause();hidden=!!root.document.hidden;syncPause();if(!hidden){resize();focusGame();}});

})(globalThis);

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4699360,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
