  root.SigmaAds={
    platform:'telegram',supportsRewarded:inTelegram,blockId:BLOCK_ID,status:()=>adState,isPaused,isMuted,
    setEventCallback(callback){listener=callback;for(const event of events.splice(0))push(event.type,event);},
    takeEvents:()=>JSON.stringify(events.splice(0)),

    setPlaying(){},happyTime(){},requestRewarded,requestInterstitial:()=>false,

    readSave(){saveRead=false;try{const value=root.localStorage.getItem(SAVE_KEY);saveRead=true;return JSON.stringify({ok:true,value,epoch:0});}catch(_){return JSON.stringify({ok:false,code:'readFailed'});}},
    writeSave(payload,epoch){if(!saveRead||epoch!==0)return JSON.stringify({ok:false,code:'saveNotLoaded'});try{root.localStorage.setItem(SAVE_KEY,payload);return JSON.stringify({ok:true});}catch(_){return JSON.stringify({ok:false,code:'writeFailed'});}},
    retryConnect(){bindTelegram();loadAds();push('state',{value:adState});}

/* Telegram Stars. Paid access comes only from the authenticated Worker ledger.
 * An invoice callback is a signal to refresh, never proof of purchase. */
(function(root){
  'use strict';
  if(root.SigmaStars)return;
  const API='https://worker.bbodaska.workers.dev';
  const TERMS='2026-11-03';
  const events=[];
  let started=false,refreshing=false,busy=false,status='loading',result='',products=[],catalog=[],userId='',canPurchase=false,lastAuth='',sequence=0,activeJob=null,lastRefresh=0;
  const validSku=id=>typeof id==='string'&&(/^(?:all_skins|tap_plus|coins_plus)$/.test(id)||/^skin_(?:[1-9]|[12][0-9]|3[0-9])$/.test(id));
  const app=()=>root.Telegram&&root.Telegram.WebApp;
  const auth=()=>typeof app()?.initData==='string'?app().initData:'';
  const owns=sku=>products.includes(sku)||(sku.startsWith('skin_')&&products.includes('all_skins'));
  function snapshot(){return {status,result,busy,products:[...products],catalog:catalog.map(x=>({...x})),user_id:userId,can_purchase:canPurchase,terms_version:TERMS};}
  function changed(){events.push({type:'state',...snapshot()});}
  function pause(value){if(root.SigmaTelegram&&typeof root.SigmaTelegram.setPaymentBusy==='function')root.SigmaTelegram.setPaymentBusy(value);}
  function later(fn,time){const timer=root.setTimeout(fn,time);if(timer&&typeof timer.unref==='function')timer.unref();return timer;}
  async function api(path,fields={}){
    const init=auth();
    if(!init)throw Object.assign(new Error(),{code:'openInTelegram'});
    const controller=new root.AbortController(),timer=later(()=>controller.abort(),12000);
    try{
      const response=await root.fetch(API+'/api/shop/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init,...fields}),signal:controller.signal,cache:'no-store',credentials:'omit',redirect:'error'});
      let data;try{data=await response.json();}catch{throw Object.assign(new Error(),{code:'shopUnavailable'});}
      if(init!==auth()){products=[];catalog=[];userId='';canPurchase=false;changed();throw Object.assign(new Error(),{code:'invalidAuth'});}
      if(!response.ok||data.ok!==true)throw Object.assign(new Error(),{code:typeof data.code==='string'?data.code:'shopUnavailable'});
      return data;
    }catch(error){if(error.code)throw error;throw Object.assign(new Error(),{code:'shopUnavailable'});}
    finally{root.clearTimeout(timer);}
  }
  function apply(data){
    if(!/^[1-9][0-9]*$/.test(String(data.user_id))||!Array.isArray(data.products)||!data.products.every(validSku)||!Array.isArray(data.catalog))throw Object.assign(new Error(),{code:'shopUnavailable'});
    if(!data.catalog.every(x=>x&&validSku(x.id)&&Number.isSafeInteger(x.stars)&&x.stars>0&&x.stars<=100000&&typeof x.title==='string'))throw Object.assign(new Error(),{code:'shopUnavailable'});
    userId=String(data.user_id);products=[...new Set(data.products)];catalog=data.catalog.map(x=>({id:x.id,stars:x.stars,title:x.title}));
    canPurchase=data.can_purchase===true;status=canPurchase?'ready':'closed';lastRefresh=Date.now();changed();
  }
  async function refresh(){
    if(refreshing||busy)return false;
    const current=auth();
    if(lastAuth!==current){lastAuth=current;products=[];catalog=[];userId='';canPurchase=false;changed();}
    if(!current){status='openInTelegram';canPurchase=false;changed();return false;}
    refreshing=true;status='loading';result='';changed();
    try{apply(await api('state'));return true;}
    catch(error){status=error.code||'shopUnavailable';canPurchase=false;changed();return false;}
    finally{refreshing=false;}
  }
  function finish(job,value){
    if(activeJob!==job)return;
    const tg=app();if(job.handler&&typeof tg?.offEvent==='function')tg.offEvent('invoiceClosed',job.handler);
    activeJob=null;busy=false;result=value;pause(false);changed();
  }
  async function reconcile(job,nativeStatus){
    if(activeJob!==job||job.closed)return;
    job.closed=true;result=nativeStatus==='paid'||nativeStatus==='pending'?'pending':nativeStatus==='cancelled'?'cancelled':'paymentFailed';changed();
    const attempts=nativeStatus==='paid'||nativeStatus==='pending'?12:1;
    for(let i=0;i<attempts;i++){
      if(activeJob!==job)return;
      try{apply(await api('state'));if(owns(job.sku)){finish(job,'purchased');return;}}
      catch(error){status=error.code||'shopUnavailable';changed();}
      if(i<attempts-1)await new Promise(resolve=>later(resolve,Math.min(3000,750+i*250)));
    }
    finish(job,nativeStatus==='paid'||nativeStatus==='pending'?'pending':nativeStatus==='cancelled'?'cancelled':'paymentFailed');
  }
  async function buy(sku){
    if(!started||busy||refreshing||!canPurchase||!validSku(sku)||owns(sku))return false;
    if(typeof app()?.openInvoice!=='function'){status='clientUnsupported';changed();return false;}
    const job={id:++sequence,sku,closed:false,url:''};activeJob=job;busy=true;result='creatingInvoice';pause(true);changed();
    try{
      const invoice=await api('invoice',{sku,terms_version:TERMS});
      if(activeJob!==job)return false;
      if(invoice.sku!==sku||!Number.isSafeInteger(invoice.stars)||!/^https:\/\/t\.me\/\$[A-Za-z0-9_-]+$/.test(invoice.invoice_url))throw Object.assign(new Error(),{code:'invoiceFailed'});
      job.url=invoice.invoice_url;
      // Native Telegram shows the final item and XTR price before charging.
      const tg=app();
      if(typeof tg.onEvent==='function'){
        job.handler=event=>{if(event?.url===job.url)reconcile(job,event.status);};
        tg.onEvent('invoiceClosed',job.handler);
      }
      tg.openInvoice(job.url,value=>{
        if(job.handler&&typeof tg.offEvent==='function')tg.offEvent('invoiceClosed',job.handler);
        reconcile(job,value);
      });
      return true;
    }catch(error){status=error.code||'invoiceFailed';finish(job,'paymentFailed');return false;}
  }
  root.SigmaStars={
    start(){if(started)return;started=true;refresh();},
    refresh,buy,
    snapshot:()=>JSON.stringify(snapshot()),
    takeEvents:()=>JSON.stringify(events.splice(0)),
    termsUrl:()=>API+'/terms',
    openTerms(){if(typeof app()?.openLink==='function')app().openLink(API+'/terms');else if(typeof root.open==='function')root.open(API+'/terms','_blank','noopener');}
  };
  if(root.addEventListener)root.addEventListener('osr-telegram-ready',()=>{if(started)refresh();});
  if(root.document?.addEventListener)root.document.addEventListener('visibilitychange',()=>{if(started&&!root.document.hidden&&!busy&&Date.now()-lastRefresh>30000)refresh();});
  // Refresh after a refund or a payment completed while the app was minimized.
  function bindResume(){const tg=app();if(tg&&typeof tg.onEvent==='function')tg.onEvent('activated',()=>{if(started&&!busy&&Date.now()-lastRefresh>30000)refresh();});}
  bindResume();if(root.addEventListener)root.addEventListener('osr-telegram-ready',bindResume);
})(globalThis);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;

	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));

	function displayFailureNotice(err) {
